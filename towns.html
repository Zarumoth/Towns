<!DOCTYPE html>
<html>
<head>
  <title>Towns</title>
  <link rel="stylesheet" href="towns.css" />
  <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
  <script src="towns.js"></script>
</head>
<body>
  <article>
    <header>
      <h1>Towns</h1>
    </header>
    <select id="towns" size="4">
      <option>Sofia</option>
      <option>Plovdiv</option>
      <option>Varna</option>
      <option>Bourgas</option>
    </select>
  </article>

  <article>
    <header>
      <h2>Add Town</h2>
    </header>
    <input type="text" id="townNameForAdd" />
    <button id="btnAdd">Add</button>
  </article>

  <article>
    <header>
      <h2>Shuffle Towns</h2>
    </header>
    <button id="btnShuffle">Shuffle</button>
  </article>

  <article>
    <header>
      <h2>Delete Existing Town</h2>
    </header>
    <input type="text" id="townName" />
    <button id="btnDelete">Delete</button>
  </article>

  <div id="result"></div>

  <script src="http://ajax.googleapis.com/ajax/libs/jqueryui/1.8.5/jquery-ui.min.js"></script>
</body>
</html>
